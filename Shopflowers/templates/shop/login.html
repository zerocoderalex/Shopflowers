{% load static %}

<head>
    <link rel="stylesheet" type="text/css" href="{% static 'shop/style.css' %}">
</head>

<h2>Вход</h2>

{% if message %}
    <ul class="message">
        {% for message in messages %}
            <li>{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Войти</button>
</form>
